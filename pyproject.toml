[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillseal"
version = "0.2.0"
description = "Local signed integrity manifests for AI agent skill bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Califi Mwarabu" }]
keywords = ["agent-skills", "integrity", "sha256", "ed25519", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["cryptography>=42,<51"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "twine>=5,<7"]

[project.scripts]
skillseal = "skillseal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillseal = ["py.typed"]
